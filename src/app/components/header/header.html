<a
  href="#facts"
  class="sr-only focus:not-sr-only focus:fixed focus:top-3 focus:left-3 focus:z-60 focus:rounded-sm focus:bg-forest focus:px-4 focus:py-2 focus:text-ivory"
>
  Skip to content
</a>

<header
  class="fixed inset-x-0 top-0 z-50 bg-ivory/95 shadow-[0_1px_0_rgba(31,36,33,0.08)] backdrop-blur-md"
>
  <div class="u-container flex h-16 items-center justify-between md:h-20">
    <a href="#model" class="-my-2 py-2 text-base font-semibold tracking-[0.18em] md:text-lg">
      {{ project.name }}
    </a>

    <nav class="hidden items-center gap-7 xl:flex" aria-label="Main">
      @for (link of links; track link.fragment) {
        <a
          [href]="'#' + link.fragment"
          class="relative text-sm text-charcoal-soft transition-colors duration-300 after:absolute after:-bottom-1.5 after:left-0 after:h-px after:w-0 after:bg-gold-soft after:transition-all after:duration-300 hover:text-charcoal hover:after:w-full"
        >
          {{ link.label }}
        </a>
      }

      @if (hasContact) {
        <a
          href="#contact"
          class="rounded-sm bg-forest px-5 py-2.5 text-sm font-medium text-ivory transition-colors duration-300 hover:bg-forest-deep"
        >
          Contact
        </a>
      }
    </nav>

    <button
      type="button"
      class="-mr-2 flex h-10 w-10 items-center justify-center xl:hidden"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="mobile-menu"
      [attr.aria-label]="menuOpen() ? 'Close menu' : 'Open menu'"
      (click)="toggleMenu()"
    >
      <span class="relative block h-4 w-6" aria-hidden="true">
        <span
          class="absolute left-0 block h-px w-6 bg-charcoal transition-all duration-300"
          [class]="menuOpen() ? 'top-1.5 rotate-45' : 'top-0'"
        ></span>
        <span
          class="absolute top-1.5 left-0 block h-px w-6 bg-charcoal transition-opacity duration-300"
          [class]="menuOpen() ? 'opacity-0' : 'opacity-100'"
        ></span>
        <span
          class="absolute left-0 block h-px w-6 bg-charcoal transition-all duration-300"
          [class]="menuOpen() ? 'top-1.5 -rotate-45' : 'top-3'"
        ></span>
      </span>
    </button>
  </div>

  <div
    id="mobile-menu"
    class="overflow-hidden border-t border-charcoal/10 bg-ivory transition-all duration-500 xl:hidden"
    [class]="menuPanelClass()"
    [attr.inert]="menuOpen() ? null : ''"
  >
    <nav class="u-container flex flex-col py-2" aria-label="Mobile">
      @for (link of links; track link.fragment) {
        <a
          [href]="'#' + link.fragment"
          class="border-b border-charcoal/10 py-3.5 text-[0.95rem] text-charcoal-soft last:border-0"
          (click)="closeMenu()"
        >
          {{ link.label }}
        </a>
      }
      @if (hasContact) {
        <a
          href="#contact"
          class="my-4 rounded-sm bg-forest px-5 py-3.5 text-center text-[0.95rem] font-medium text-ivory"
          (click)="closeMenu()"
        >
          Contact
        </a>
      }
    </nav>
  </div>
</header>
